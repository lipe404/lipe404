name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: '23 13 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'scripts/update_profile_stats.py'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Gerar painel com a API pública do GitHub
        run: python3 scripts/update_profile_stats.py
      - name: Publicar alterações no README
        run: |
          git add -- README.md assets/linguagens.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'docs: atualiza estatísticas públicas do perfil'
          git push origin HEAD:main
